    function canTwo(sm, ym) {
      return !!(TWO[sm] && TWO[sm].includes(ym));
    }

    function findMedials(sm, ym) {
      const map = THREE[sm];
      if (!map) return [];
      const list = [];
      for (const m of ["i", "u", "ü"]) {
        if (map[m] && map[m].includes(ym)) list.push(m);
      }
      return list;
    }

    /** 判题：整体认读优先，其次两拼 / 需要介母 / 不可以 */
    function classify(sm, ym) {
      const zt = ZHENGTI_KEY.get(`${sm}+${ym}`);
      if (zt) return { answer: "zhengti", medial: null, medials: [], syllable: zt };
      if (canTwo(sm, ym)) return { answer: "ok", medial: null, medials: [], syllable: writeSyllable(sm, null, ym) };
      const medials = findMedials(sm, ym);
      if (medials.length) {
        // medial 先存第一个；小朋友选定后再更新为实际选择
        const m = medials[0];
        return {
          answer: "medial",
          medial: m,
          medials,
          syllable: writeSyllable(sm, m, ym),
          syllables: Object.fromEntries(medials.map((x) => [x, writeSyllable(sm, x, ym)])),
        };
      }
      return { answer: "no", medial: null, medials: [], syllable: null };
    }

    function writeSyllable(sm, medial, ym) {
      let core = (medial || "") + ym;
      if (["j", "q", "x"].includes(sm) && core.startsWith("ü")) {
        core = core.replace(/^ü/, "u");
      }
      if (sm === "y" && ym === "ü") return "yu";
      return sm + core;
    }

    function allPairsByKind() {
      const ok = [];
      const medial = [];
      const no = [];
      const zhengti = ZHENGTI_PAIRS.map(([sm, ym, syl]) => [sm, ym, { answer: "zhengti", medial: null, syllable: syl }]);

      for (const sm of SHENGMU) {
        for (const ym of YUNMU) {
          const c = classify(sm, ym);
          if (c.answer === "ok") ok.push([sm, ym, c]);
          else if (c.answer === "medial") medial.push([sm, ym, c]);
          else if (c.answer === "no") no.push([sm, ym, c]);
          // zhengti 已由 ZHENGTI_PAIRS 收录（含 üan 等）
        }
      }
      return { ok, medial, no, zhengti };
    }

    const BANK = allPairsByKind();

    function pickPairForQuiz() {
      const roll = Math.random();
      let pool;
      if (roll < 0.32) pool = BANK.ok;
      else if (roll < 0.52) pool = BANK.medial;
      else if (roll < 0.74) pool = BANK.zhengti;
      else pool = BANK.no;
      if (!pool.length) pool = BANK.ok;
      const [sm, ym, c] = pick(pool);
      return { sm, ym, ...c };
    }

    function makeDay() {
      // 整体认读不直接从城堡出来，只通过「声母+韵母 → 整体认读」出现
      const pair = pickPairForQuiz();
      return {
        sm: pair.sm,
        ym: pair.ym,
        quiz: pair,
      };
    }

    function bumpCorrect() {
      correctCount += 1;
      if (correctCountEl) correctCountEl.textContent = String(correctCount);
    }

    // 与声母/韵母首次出场相同的步行时长（约占一天的 0.18）
    const WALK_MS = DAY_MS * 0.18;

    function towerDoor(family, L) {
      // 城堡大门门槛外侧
      const t = L.towers[family] || L.towers.zhengti;
      return { x: t.cx, y: t.baseY - 4 };
    }

    function towerInside(family, L) {
      // 大门洞内深处（进出都经过这里）
      const t = L.towers[family] || L.towers.zhengti;
      return { x: t.cx, y: t.baseY - Math.min(48, t.h * 0.26) };
    }

    function actorBellyW(text) {
      const chars = Math.max(1, String(text || "").length);
      return Math.max(52, 28 + chars * 16);
    }

    /** 从大门走出到目标：门前淡入，始终在城堡前面 */
    function startDoorExit(a, L, dest, delayMs) {
      const door = towerDoor(a.family, L);
      a.walkKind = "exit";
      a.walkStart = performance.now() + (delayMs || 0);
      a.walkFrom = { x: door.x, y: door.y };
      a.walkVia = { x: door.x, y: door.y };
      a.walkTo = { x: dest.x, y: dest.y };
      a.x = door.x;
      a.y = door.y;
      a.tx = dest.x;
      a.ty = dest.y;
      a.behindTower = false;
      a.visible = true;
      a.scale = 1;
      a.alpha = 0;
      a.goingHome = false;
      a.atHome = false;
      a.phase = "exit";
      // 介母出门后整段走在声母精灵后面（z）
      a.drawBehindSm = a.role === "jm";
    }

    /** 走回大门：门前淡出，始终在城堡前面 */
    function startDoorEnter(a, L) {
      if (a.atHome) return;
      if (a.walkKind === "enter" && a.walkStart != null) return;
      const door = towerDoor(a.family, L);
      a.walkKind = "enter";
      a.walkStart = performance.now();
      a.walkFrom = { x: a.x, y: a.y };
      a.walkVia = { x: door.x, y: door.y };
      a.walkTo = { x: door.x, y: door.y };
      a.playing = false;
      a.goingHome = true;
      a.atHome = false;
      a.phase = "return";
      a.behindTower = false;
      a.scale = 1;
      a.alpha = a.alpha == null ? 1 : a.alpha;
      a.drawBehindSm = false;
    }

    /** 推进大门进出动画；返回 true 表示走完 */
    function stepDoorWalk(a) {
      if (a.walkStart == null || !a.walkKind) return false;
      const now = performance.now();
      if (now < a.walkStart) {
        a.x = a.walkFrom.x;
        a.y = a.walkFrom.y;
        a.behindTower = false;
        if (a.walkKind === "exit") a.alpha = 0;
        return false;
      }
      const u = easeOut(clamp((now - a.walkStart) / WALK_MS, 0, 1));

      if (a.walkKind === "exit") {
        // 0~0.28：停在大门口淡入；之后走到广场
        const fadeEnd = 0.28;
        if (u < fadeEnd) {
          const v = u / fadeEnd;
          a.x = a.walkFrom.x;
          a.y = a.walkFrom.y;
          a.alpha = v;
        } else {
          const v = (u - fadeEnd) / (1 - fadeEnd);
          a.x = lerp(a.walkVia.x, a.walkTo.x, v);
          a.y = lerp(a.walkVia.y, a.walkTo.y, v);
          a.alpha = 1;
        }
        a.behindTower = false;
        a.scale = 1;
        if (a.role === "jm") a.drawBehindSm = true;
        if (u >= 1) {
          a.x = a.walkTo.x;
          a.y = a.walkTo.y;
          a.walkStart = null;
          a.walkKind = null;
          a.alpha = 1;
          a.behindTower = false;
          a.drawBehindSm = a.role === "jm"; // 到广场站定后仍可被声母挡住一点，play 时清掉
          a._wasOut = true;
          return true;
        }
        return false;
      }

      if (a.walkKind === "enter") {
        // 0~0.62：走到大门口；之后停在门前淡出
        const arrive = 0.62;
        if (u < arrive) {
          const v = u / arrive;
          a.x = lerp(a.walkFrom.x, a.walkVia.x, v);
          a.y = lerp(a.walkFrom.y, a.walkVia.y, v);
          a.alpha = 1;
        } else {
          const v = (u - arrive) / (1 - arrive);
          a.x = a.walkVia.x;
          a.y = a.walkVia.y;
          a.alpha = 1 - v;
        }
        a.behindTower = false;
        a.scale = 1;
        a.drawBehindSm = false;
        if (u >= 1) {
          a.x = a.walkTo.x;
          a.y = a.walkTo.y;
          a.walkStart = null;
          a.walkKind = null;
          a.alpha = 0;
          a.visible = false;
          a.behindTower = false;
          a.goingHome = false;
          a.atHome = true; // 已进门：不再触发开合
          return true;
        }
        return false;
      }

      return false;
    }

    /** 某座城堡大门开合程度 0..1（精灵进出时自动开合） */
    function doorOpenAmount(family) {
      let open = 0;
      const now = performance.now();
      actors.forEach((a) => {
        if (a.family !== family || !a.walkKind || a.walkStart == null) return;
        if (now < a.walkStart) {
          if (a.walkKind === "exit") open = Math.max(open, 0.7);
          return;
        }
        const u = clamp((now - a.walkStart) / WALK_MS, 0, 1);
        if (a.walkKind === "exit") {
          // 淡入开门 → 离开时保持开 → 走开后关上
          if (u < 0.28) open = Math.max(open, clamp(u / 0.12, 0, 1));
          else if (u < 0.55) open = Math.max(open, 1);
          else open = Math.max(open, clamp(1 - (u - 0.55) / 0.3, 0, 1));
        } else if (a.walkKind === "enter") {
          // 走近开门 → 淡出时保持开 → 进门后关上
          if (u < 0.35) open = Math.max(open, clamp(u / 0.2, 0, 1));
          else if (u < 0.85) open = Math.max(open, 1);
          else open = Math.max(open, clamp(1 - (u - 0.85) / 0.15, 0, 1));
        }
      });
      return clamp(open, 0, 1);
    }

    /** 拉手伙伴是否都已到广场（三人模式须等介母到齐） */
    function playmatesReady() {
      if (playMode === "duo") {
        return ["sm", "ym"].every((r) =>
          actors.some((a) => a.role === r && a.visible && a.phase === "play" && !a.behindTower)
        );
      }
      if (playMode === "trio") {
        return ["sm", "jm", "ym"].every((r) =>
          actors.some((a) => a.role === r && a.visible && a.phase === "play" && !a.behindTower)
        );
      }
      return false;
    }

    function spawnActors(day, L) {
      const plazaY = L.plaza.cy - 8;
      actors = [
        {
          kind: "partner",
          role: "sm",
          text: day.sm,
          family: "shengmu",
          color: FAMILY.shengmu.color,
          x: 0,
          y: 0,
          tx: L.plaza.cx - 72,
          ty: plazaY,
          visible: true,
          phase: "exit",
          playing: false,
          scale: 1,
        },
        {
          kind: "partner",
          role: "ym",
          text: day.ym,
          family: "yunmu",
          color: FAMILY.yunmu.color,
          x: 0,
          y: 0,
          tx: L.plaza.cx + 72,
          ty: plazaY,
          visible: true,
          phase: "exit",
          playing: false,
          scale: 1,
        },
      ];
      // 都从各自城堡大门走出，速度与原先出场一致
      startDoorExit(actors[0], L, { x: L.plaza.cx - 72, y: plazaY }, 0);
      startDoorExit(actors[1], L, { x: L.plaza.cx + 72, y: plazaY }, DAY_MS * 0.06);
    }

    function inviteFriendsToPlaza(mode) {
      playMode = mode;
      const L = layout();
      const plazaY = L.plaza.cy - 8;
      // 两人挨紧拉手；三人稍分开给介母站中间
      const gap = mode === "trio" ? 52 : 28;

      actors.forEach((a) => {
        if (a.role === "sm" || a.role === "ym") {
          a.tx = a.role === "sm" ? L.plaza.cx - gap : L.plaza.cx + gap;
          a.ty = plazaY;
          a.visible = true;
          a.playing = true;
          a.phase = "exit";
          a.goingHome = false;
          a.walkKind = null;
          a.walkStart = null;
          a.behindTower = false;
          a.walkT = 0;
          a.scale = 1;
          a.alpha = 1;
          a.drawBehindSm = false;
        }
      });

      actors = actors.filter((a) => a.role !== "jm" && a.role !== "zt");

      if (mode === "trio" && today.quiz && today.quiz.medial) {
        const m = today.quiz.medial;
        const jm = {
          kind: "partner",
          role: "jm",
          text: m,
          family: "jiemu",
          color: FAMILY.jiemu.color,
          x: 0,
          y: 0,
          tx: L.plaza.cx,
          ty: plazaY,
          visible: true,
          phase: "exit",
          playing: true,
          goingHome: false,
          walkT: 0,
          scale: 1,
        };
        actors.push(jm);
        // 介母从介母城堡出门（门开合+淡入），z 轴走在声母后面
        startDoorExit(jm, L, { x: L.plaza.cx, y: plazaY }, 0);
      }

      actors.forEach((a) => { a._wasOut = true; });
      scheduleHornTones(350);
    }

    /** 整体认读：声母韵母回家，音节从中央城堡出来自己玩 */
    function summonZhengtiAlone() {
      playMode = "zhengti";
      stopHornSpeak();
      const L = layout();
      const plazaY = L.plaza.cy - 8;
      const syl = today.quiz.syllable;

      actors.forEach((a) => {
        if (a.role === "sm" || a.role === "ym") {
          startDoorEnter(a, L);
        }
      });

      setTimeout(() => {
        if (!today || playMode !== "zhengti") return;
        actors = actors.filter((a) => a.role !== "sm" && a.role !== "ym");
        const zt = {
          kind: "star",
          role: "zt",
          text: syl,
          family: "zhengti",
          color: FAMILY.zhengti.color,
          x: 0,
          y: 0,
          tx: L.plaza.cx,
          ty: plazaY,
          visible: true,
          phase: "exit",
          playing: true,
          goingHome: false,
          walkT: 0,
          _wasOut: true,
          scale: 1,
        };
        actors.push(zt);
        startDoorExit(zt, L, { x: L.plaza.cx, y: plazaY }, 0);
        scheduleHornTones(200);
      }, WALK_MS);
    }

    function sendHomeNoPlay() {
      playMode = "none";
      stopHornSpeak();
      const L = layout();
      actors.forEach((a) => startDoorEnter(a, L));
    }

    function setStory(day, progress) {
      dayNumEl.textContent = String(dayIndex);
      if (correctCountEl) correctCountEl.textContent = String(correctCount);

      if (quizOpen && quizStage === "can") {
        storyTextEl.textContent = "声母在左、韵母在右——他们该怎么玩？";
        return;
      }
      if (quizOpen && quizStage === "medial") {
        const meds = (day.quiz && day.quiz.medials) || [];
        storyTextEl.textContent = meds.length > 1
          ? "还差介母！这里不止一个答案，选对其中一个就行。"
          : "还差一个介母！请 i、u、ü 谁来帮忙？";
        return;
      }

      if (progress < 0.08) {
        storyTextEl.textContent = "太阳从左边升起——新的一天开始了！";
      } else if (progress < 0.22) {
        storyTextEl.textContent = `「${day.sm}」和「${day.ym}」从声母塔、韵母塔里走出来了。`;
      } else if (!quizSolved) {
        storyTextEl.textContent = "先判断：可以拼？需要介母？整体认读？还是不可以？";
      } else if (progress < 0.78) {
        const q = day.quiz;
        if (hornSpeaking && hornToneIndex >= 0) {
          const slot = hornToneSlots.find((s) => s.toneIndex === hornToneIndex);
          const hz = slot ? slot.hz : "";
          const form = slot ? slot.form : (hornTonedForms[hornToneIndex] || "");
          storyTextEl.textContent = hz
            ? `喇叭播报：${TONE_NAMES[hornToneIndex]} ${form}（${hz}）`
            : `喇叭播报：${TONE_NAMES[hornToneIndex]} ${form}`;
        } else if (playMode === "duo") {
          storyTextEl.textContent = `可以一起玩！${day.sm} + ${day.ym} → ${q.syllable}（听喇叭读四声）`;
        } else if (playMode === "trio") {
          storyTextEl.textContent = `介母「${q.medial}」从蓝色城堡出来（走在声母后面）：${day.sm} + ${q.medial} + ${day.ym} → ${q.syllable}（听喇叭读四声）`;
        } else if (playMode === "zhengti") {
          storyTextEl.textContent = `整体认读「${q.syllable}」自己玩——听喇叭读四个声调！`;
        } else {
          storyTextEl.textContent = "他们玩不到一起，只好挥手再见啦。";
        }
      } else if (progress < 0.9) {
        storyTextEl.textContent = "太阳往右边落下去了……一天快结束啦。";
      } else {
        storyTextEl.textContent = "夜深了，拼音们回到城堡里睡觉。";
      }
    }

    function resumeDay() {
      dayPaused = false;
      dayStart = performance.now() - pauseAt * DAY_MS;
      setStory(today, pauseAt);
    }

    function openQuiz() {
      if (quizOpen || quizSolved || !today) return;
      quizOpen = true;
      quizStage = "can";
      dayPaused = true;
      pauseAt = dayProgress;
      panelCan.hidden = false;
      panelMedial.hidden = true;
      quizSmEl.textContent = today.sm;
      quizYmEl.textContent = today.ym;
      quizFeedbackEl.textContent = "";
      quizFeedbackEl.className = "feedback";
      answerBtns.forEach((b) => {
        b.disabled = false;
        b.classList.remove("correct-flash", "wrong-flash");
      });
      quizEl.classList.add("show");
      nextBtn.hidden = true;
      setStory(today, dayProgress);
    }

    function openMedialQuiz() {
      quizStage = "medial";
      panelCan.hidden = true;
      panelMedial.hidden = false;
      medSmEl.textContent = today.sm;
      medYmEl.textContent = today.ym;
      medFeedbackEl.textContent = "";
      medFeedbackEl.className = "feedback";
      const meds = (today.quiz && today.quiz.medials) || [];
      const askEl = document.getElementById("medAsk");
      if (askEl) {
        askEl.textContent = meds.length > 1
          ? "这里可以有好几个介母，选对其中任意一个就行！"
          : "请一个介母来牵手吧！选哪一个？";
      }
      medialBtns.forEach((b) => {
        b.disabled = false;
        b.classList.remove("correct-flash", "wrong-flash");
      });
      quizEl.classList.add("show");
      nextBtn.hidden = true;
      dayPaused = true;
      setStory(today, dayProgress);
    }

    function closeQuiz() {
      quizOpen = false;
      quizEl.classList.remove("show");
      nextBtn.hidden = false;
    }

    function explainAnswer(q) {
      if (q.answer === "ok") {
        return `答案是「可以」：${today.sm} 和 ${today.ym} 能直接拼成 ${q.syllable}。`;
      }
      if (q.answer === "medial") {
        const meds = q.medials && q.medials.length ? q.medials : (q.medial ? [q.medial] : []);
        if (meds.length > 1) {
          return `答案是「需要介母」：可以请 ${meds.join(" 或 ")} 来帮忙。`;
        }
        return `答案是「需要介母」：中间要请介母「${meds[0] || q.medial}」来帮忙。`;
      }
      if (q.answer === "zhengti") {
        return `答案是「整体认读」：组成「${q.syllable}」，不用拼，要整个认！`;
      }
      return `答案是「不可以」：这两个拼音组成不了音节。`;
    }

    function onAnswer(choice) {
      unlockAudio();
      if (!quizOpen || quizStage !== "can" || !today || !today.quiz) return;
      const q = today.quiz;
      const btn = answerBtns.find((b) => b.dataset.answer === choice);
      if (!btn) return;

      if (choice === q.answer) {
        btn.classList.add("correct-flash");
        quizFeedbackEl.className = "feedback";
        answerBtns.forEach((b) => { b.disabled = true; });
        bumpCorrect();

        if (choice === "ok") {
          quizFeedbackEl.textContent = "答对啦！请他们去广场玩吧！";
          setTimeout(() => {
            quizSolved = true;
            closeQuiz();
            inviteFriendsToPlaza("duo");
            resumeDay();
          }, 700);
        } else if (choice === "medial") {
          quizFeedbackEl.textContent = "对！还需要介母帮忙～";
          setTimeout(() => openMedialQuiz(), 700);
        } else if (choice === "zhengti") {
          quizFeedbackEl.textContent = `对！是整体认读「${q.syllable}」！`;
          setTimeout(() => {
            quizSolved = true;
            closeQuiz();
            summonZhengtiAlone();
            resumeDay();
          }, 700);
        } else {
          quizFeedbackEl.textContent = "答对啦！他们玩不到一起。";
          setTimeout(() => {
            quizSolved = true;
            closeQuiz();
            sendHomeNoPlay();
            resumeDay();
          }, 700);
        }
      } else {
        btn.classList.add("wrong-flash");
        quizFeedbackEl.className = "feedback bad";
        quizFeedbackEl.textContent = `还不对哦，不是「${ANSWER_LABEL[choice]}」。再想想！`;
        setTimeout(() => btn.classList.remove("wrong-flash"), 450);
      }
    }

    function onMedialPick(choice) {
      unlockAudio();
      if (!quizOpen || quizStage !== "medial" || !today || !today.quiz) return;
      const q = today.quiz;
      const okList = (q.medials && q.medials.length) ? q.medials : (q.medial ? [q.medial] : []);
      const btn = medialBtns.find((b) => b.dataset.medial === choice);
      if (!btn) return;

      if (okList.includes(choice)) {
        // 锁定小朋友选中的介母，并更新拼出的音节
        q.medial = choice;
        q.syllable = (q.syllables && q.syllables[choice]) || writeSyllable(today.sm, choice, today.ym);
        btn.classList.add("correct-flash");
        medFeedbackEl.className = "feedback";
        bumpCorrect();
        const extra = okList.length > 1
          ? `（也可以是 ${okList.filter((m) => m !== choice).join(" / ")}）`
          : "";
        medFeedbackEl.textContent = `对！介母「${choice}」→ ${q.syllable}${extra}`;
        medialBtns.forEach((b) => { b.disabled = true; });
        setTimeout(() => {
          quizSolved = true;
          closeQuiz();
          inviteFriendsToPlaza("trio");
          resumeDay();
        }, 900);
      } else {
        btn.classList.add("wrong-flash");
        medFeedbackEl.className = "feedback bad";
        medFeedbackEl.textContent = `「${choice}」这次不能牵手，再选！`;
        setTimeout(() => btn.classList.remove("wrong-flash"), 450);
      }
    }

    answerBtns.forEach((b) => {
      b.addEventListener("click", () => onAnswer(b.dataset.answer));
    });
    medialBtns.forEach((b) => {
      b.addEventListener("click", () => onMedialPick(b.dataset.medial));
    });

    function beginDay() {
      dayIndex += 1;
      dayStart = performance.now();
      dayPaused = false;
      quizSolved = false;
      quizOpen = false;
      quizStage = "can";
      playMode = null;
      stopHornSpeak();
      closeQuiz();
      today = makeDay();
      playMode = null;
      spawnActors(today, layout());
      setStory(today, 0);
      nextBtn.hidden = false;
      nextBtn.textContent = "日子一天天过去 · 点这里进入下一天";
    }

    function layout() {
      const cx = W * 0.5;
      const ground = H * 0.74;
      const tw = Math.min(108, W * 0.145);
      const th = Math.min(168, H * 0.29);
      // 外低内高：最外侧两座靠下围住广场，中间两座靠后靠上
      const frontY = ground + Math.min(36, H * 0.045);
      const backY = ground - Math.min(34, H * 0.05);
      const towers = {
        shengmu: { cx: W * 0.10, baseY: frontY, w: tw, h: th },
        jiemu: { cx: W * 0.275, baseY: backY, w: tw, h: th },
        yunmu: { cx: W * 0.725, baseY: backY, w: tw, h: th },
        zhengti: { cx: W * 0.90, baseY: frontY, w: tw, h: th },
      };
      const gateBaseY = (frontY + backY) / 2;
      const gateTop = gateBaseY - 98; // 城门雉堞顶
      // 杆底继续下插到门楼主体中部，绘制时被城门/城垛盖住
      const hornPlantY = gateBaseY - 48;
      return {
        towers,
        plaza: {
          cx,
          cy: ground + H * 0.085,
          rw: Math.min(300, W * 0.44),
          rh: Math.min(105, H * 0.12),
        },
        gate: { cx, baseY: gateBaseY },
        // cy=喇叭本体；baseY=杆子底部（在城门后方）
        horn: { cx: cx + 4, cy: gateTop - 78, baseY: hornPlantY },
        ground,
      };
    }

    function resize() {
      const rect = stage.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width;
      H = rect.height;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (today) {
        const L = layout();
        actors.forEach((a) => {
          if (a.role === "sm") a.tx = playMode === "trio" ? L.plaza.cx - 52 : L.plaza.cx - 28;
          else if (a.role === "ym") a.tx = playMode === "trio" ? L.plaza.cx + 52 : L.plaza.cx + 28;
          else if (a.role === "jm" || a.role === "zt") a.tx = L.plaza.cx;
          else if (a.role === "jm" || a.role === "zt") a.tx = L.plaza.cx;
          a.ty = L.plaza.cy - 8;
        });
      }
    }

    function roundRect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function hexToRgb(hex) {
      const h = hex.replace("#", "");
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    }

    function mix(a, b, t) {
      const pa = hexToRgb(a);
      const pb = hexToRgb(b);
      return `rgb(${Math.round(lerp(pa.r, pb.r, t))},${Math.round(lerp(pa.g, pb.g, t))},${Math.round(lerp(pa.b, pb.b, t))})`;
    }

    function skyColors(p) {
      if (p < 0.15) {
        const t = p / 0.15;
        return { top: mix("#1a2848", "#ff9a5a", t), mid: mix("#2a3a68", "#ffc98a", t), low: mix("#3a4a78", "#ffe6b0", t) };
      }
      if (p < 0.75) {
        return { top: "#7ec8ff", mid: "#c8e9ff", low: "#fff3d6" };
      }
      if (p < 0.9) {
        const t = (p - 0.75) / 0.15;
        return { top: mix("#5eb0ff", "#ff7a4a", t), mid: mix("#c8e9ff", "#ffb070", t), low: mix("#fff3d6", "#ffd0a0", t) };
      }
      const t = (p - 0.9) / 0.1;
      return { top: mix("#ff7a4a", "#0e1a30", t), mid: mix("#ffb070", "#1a2a48", t), low: mix("#ffd0a0", "#243858", t) };
    }

    function sunPos(p) {
      const x = lerp(-40, W + 40, p);
      const arc = Math.sin(Math.PI * clamp(p, 0, 1));
      const y = H * 0.55 - arc * H * 0.38;
      return { x, y, visible: p > 0.02 && p < 0.95 };
    }

    function drawCloud(x, y, s, a) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(x, y, 38 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 28 * s, y + 4 * s, 24 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 30 * s, y + 2 * s, 26 * s, 15 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSun(x, y) {
      ctx.fillStyle = "rgba(255,210,80,0.28)";
      ctx.beginPath();
      ctx.arc(x, y, 48, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd45a";
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMoon(x, y, a) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = "#e8f0ff";
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x + 8, y - 4, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBanner(x, y, text, color, wave) {
      // (x,y) = 旗杆底部；旗杆固定不晃，只有旗布飘扬
      ctx.save();
      ctx.translate(x, y);
      // 底座小球
      ctx.fillStyle = "#e8c070";
      ctx.beginPath();
      ctx.arc(0, 2, 4, 0, Math.PI * 2);
      ctx.fill();
      // 旗杆向上（固定）
      ctx.strokeStyle = "#6b4a2e";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -64);
      ctx.stroke();
      // 杆顶珠
      ctx.fillStyle = "#f0d080";
      ctx.beginPath();
      ctx.arc(0, -64, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // 旗布飘扬（波浪变形）
      const w1 = Math.sin(wave) * 7;
      const w2 = Math.sin(wave * 1.3 + 0.8) * 9;
      const w3 = Math.sin(wave * 0.9 + 1.6) * 6;
      const fg = ctx.createLinearGradient(2, -60, 56 + w2, -20);
      fg.addColorStop(0, softHex(color, 0.25));
      fg.addColorStop(0.5, color);
      fg.addColorStop(1, softHex(color, -0.12));
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(2, -58);
      ctx.quadraticCurveTo(26 + w1 * 0.4, -64 + w1 * 0.15, 56 + w2, -52 + w3 * 0.4);
      ctx.lineTo(50 + w3, -22 + w2 * 0.2);
      ctx.quadraticCurveTo(26 + w1 * 0.3, -30 + w1 * 0.1, 2, -28);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = `700 ${Math.max(11, W * 0.018)}px "Noto Sans SC", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 26 + w1 * 0.25, -42 + w2 * 0.08);
      ctx.restore();
    }

    function softHex(hex, delta) {
      const { r, g, b } = hexToRgb(hex);
      const adj = (v) => Math.max(0, Math.min(255, Math.round(v + delta * 255)));
      return `rgb(${adj(r)},${adj(g)},${adj(b)})`;
    }

    function drawTower(cx, baseY, w, h, color, soft, label, wave, roofH, lit, doorOpen) {
      const x = cx - w / 2;
      const y = baseY - h;
      const roofBase = y;
      const merlonCount = 5;
      const pad = 3;
      const slot = (w - pad * 2) / merlonCount;
      const merlonW = slot * 0.58;
      const merlonH = 18;
      const open = clamp(doorOpen == null ? 0 : doorOpen, 0, 1);

      // 地基阴影
      ctx.fillStyle = "rgba(42,58,74,0.18)";
      ctx.beginPath();
      ctx.ellipse(cx, baseY + 6, w * 0.58, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // z 轴从后到前：顶部三角形 → 城垛 → 城堡主体
      // 1) 尖顶屋顶（略窄，底角不从城垛两侧露出）
      ctx.fillStyle = "#8b3a1a";
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.36, roofBase);
      ctx.lineTo(cx, roofBase - roofH);
      ctx.lineTo(cx + w * 0.36, roofBase);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#c45a2a";
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.26, roofBase);
      ctx.lineTo(cx, roofBase - roofH * 0.72);
      ctx.lineTo(cx + w * 0.26, roofBase);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#e8c070";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, roofBase - roofH);
      ctx.lineTo(cx, roofBase);
      ctx.stroke();
      ctx.fillStyle = "#f0d080";
      ctx.beginPath();
      ctx.arc(cx, roofBase - roofH - 3, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // 2) 城垛（中间层，盖住屋顶底边）
      for (let i = 0; i < merlonCount; i++) {
        const mx = x + pad + i * slot + (slot - merlonW) / 2;
        const mg = ctx.createLinearGradient(mx, y - merlonH, mx, y + 4);
        mg.addColorStop(0, soft);
        mg.addColorStop(1, color);
        ctx.fillStyle = mg;
        roundRect(mx, y - merlonH + 2, merlonW, merlonH + 4, 3);
        ctx.fill();
        ctx.strokeStyle = softHex(color, -0.2);
        ctx.lineWidth = 1;
        roundRect(mx, y - merlonH + 2, merlonW, merlonH + 4, 3);
        ctx.stroke();
      }

      // 3) 城堡主体（最前层，盖住城垛下半）
      const g = ctx.createLinearGradient(x, y, x + w, y);
      g.addColorStop(0, soft);
      g.addColorStop(0.35, color);
      g.addColorStop(0.7, softHex(color, -0.08));
      g.addColorStop(1, soft);
      ctx.fillStyle = g;
      roundRect(x, y, w, h, 12);
      ctx.fill();

      // 砖缝纹理
      ctx.save();
      ctx.beginPath();
      roundRect(x, y, w, h, 12);
      ctx.clip();
      ctx.strokeStyle = "rgba(255,255,255,0.14)";
      ctx.lineWidth = 1;
      const brickH = Math.max(8, h * 0.055);
      const brickW = Math.max(14, w * 0.28);
      for (let row = 0; row * brickH < h; row++) {
        const yy = y + row * brickH;
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.lineTo(x + w, yy);
        ctx.stroke();
        const off = row % 2 ? brickW * 0.5 : 0;
        for (let col = -1; col * brickW < w + brickW; col++) {
          const xx = x + off + col * brickW;
          ctx.beginPath();
          ctx.moveTo(xx, yy);
          ctx.lineTo(xx, yy + brickH);
          ctx.stroke();
        }
      }
      ctx.restore();

      ctx.strokeStyle = softHex(color, -0.22);
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 12);
      ctx.stroke();

      // 拱形窗户
      const winW = Math.max(12, w * 0.18);
      const winH = Math.max(16, h * 0.14);
      const glow = lit ? "#ffe9a0" : "#fff8e0";
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 2; col++) {
          const wx = x + w * 0.2 + col * w * 0.4;
          const wy = y + h * 0.18 + row * h * 0.26;
          ctx.fillStyle = softHex(color, -0.25);
          roundRect(wx - 3, wy - 3, winW + 6, winH + 10, 5);
          ctx.fill();
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.moveTo(wx, wy + winH * 0.35);
          ctx.lineTo(wx, wy + winH);
          ctx.lineTo(wx + winW, wy + winH);
          ctx.lineTo(wx + winW, wy + winH * 0.35);
          ctx.arc(wx + winW / 2, wy + winH * 0.35, winW / 2, 0, Math.PI, true);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = softHex(color, -0.3);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(wx + winW / 2, wy);
          ctx.lineTo(wx + winW / 2, wy + winH);
          ctx.moveTo(wx, wy + winH * 0.55);
          ctx.lineTo(wx + winW, wy + winH * 0.55);
          ctx.stroke();
          if (lit) {
            ctx.fillStyle = "rgba(255,220,120,0.35)";
            ctx.beginPath();
            ctx.arc(wx + winW / 2, wy + winH * 0.55, winW * 0.9, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // 拱门（洞 + 可开合双扇门）
      const doorW = w * 0.34;
      const doorH = h * 0.3;
      // 门洞暗影
      ctx.fillStyle = "#2a1810";
      ctx.beginPath();
      ctx.moveTo(cx - doorW / 2, baseY);
      ctx.lineTo(cx - doorW / 2, baseY - doorH * 0.62);
      ctx.arc(cx, baseY - doorH * 0.62, doorW / 2, Math.PI, 0);
      ctx.lineTo(cx + doorW / 2, baseY);
      ctx.closePath();
      ctx.fill();

      // 双扇木门：open=0 合拢，open=1 向两侧打开
      const leafMax = doorW * 0.5;
      const leafW = Math.max(2, leafMax * (1 - open * 0.92));
      const hingeL = cx - doorW / 2;
      const hingeR = cx + doorW / 2;
      const archTop = baseY - doorH * 0.62;
      const drawLeaf = (left) => {
        const hx = left ? hingeL : hingeR;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx - doorW / 2, baseY);
        ctx.lineTo(cx - doorW / 2, archTop);
        ctx.arc(cx, archTop, doorW / 2, Math.PI, 0);
        ctx.lineTo(cx + doorW / 2, baseY);
        ctx.closePath();
        ctx.clip();
        const lg = ctx.createLinearGradient(hx, archTop, left ? hx + leafW : hx - leafW, baseY);
        lg.addColorStop(0, "#8b5a2b");
        lg.addColorStop(0.5, "#6b3f1a");
        lg.addColorStop(1, "#4a2a12");
        ctx.fillStyle = lg;
        if (left) {
          ctx.fillRect(hx, archTop - doorW * 0.15, leafW, doorH + doorW * 0.2);
        } else {
          ctx.fillRect(hx - leafW, archTop - doorW * 0.15, leafW, doorH + doorW * 0.2);
        }
        // 门钉
        if (leafW > 8) {
          ctx.fillStyle = "#d4a85a";
          const cols = 2;
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < cols; c++) {
              const px = left
                ? hx + leafW * (0.28 + c * 0.36)
                : hx - leafW * (0.28 + c * 0.36);
              const py = baseY - doorH * 0.18 - r * doorH * 0.14;
              ctx.beginPath();
              ctx.arc(px, py, 2.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        // 门缝高光
        ctx.strokeStyle = "rgba(255,220,160,0.25)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (left) {
          ctx.moveTo(hx + leafW - 1, archTop);
          ctx.lineTo(hx + leafW - 1, baseY);
        } else {
          ctx.moveTo(hx - leafW + 1, archTop);
          ctx.lineTo(hx - leafW + 1, baseY);
        }
        ctx.stroke();
        ctx.restore();
      };
      drawLeaf(true);
      drawLeaf(false);

      // 旗帜插在屋顶尖（最前）
      drawBanner(cx, roofBase - roofH - 2, label.slice(0, 2), color, wave);
    }

    function drawGate(L) {
      const gx = L.gate.cx;
      const gy = L.gate.baseY != null ? L.gate.baseY : L.ground;
      const gw = 96;
      const gh = 86;

      // 雉堞在主体后面、喇叭杆前面（杆已先画）
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i % 2 ? "#b89570" : "#a88860";
        roundRect(gx - gw / 2 + 6 + i * 17, gy - gh - 12, 12, 14, 2);
        ctx.fill();
      }

      // 门楼主体盖住雉堞下半
      const gcol = ctx.createLinearGradient(gx - gw / 2, gy - gh, gx + gw / 2, gy - gh);
      gcol.addColorStop(0, "#c4a882");
      gcol.addColorStop(0.5, "#a88860");
      gcol.addColorStop(1, "#c4a882");
      ctx.fillStyle = gcol;
      roundRect(gx - gw / 2, gy - gh, gw, gh, 8);
      ctx.fill();
      ctx.strokeStyle = "#8a6a48";
      ctx.lineWidth = 2;
      roundRect(gx - gw / 2, gy - gh, gw, gh, 8);
      ctx.stroke();

      // 拱门洞
      ctx.fillStyle = "#3a2818";
      ctx.beginPath();
      ctx.moveTo(gx - 30, gy);
      ctx.lineTo(gx - 30, gy - 48);
      ctx.arc(gx, gy - 48, 30, Math.PI, 0);
      ctx.lineTo(gx + 30, gy);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#1e140c";
      ctx.beginPath();
      ctx.moveTo(gx - 20, gy);
      ctx.lineTo(gx - 20, gy - 40);
      ctx.arc(gx, gy - 40, 20, Math.PI, 0);
      ctx.lineTo(gx + 20, gy);
      ctx.closePath();
      ctx.fill();
    }

    function drawWalls(L, T) {
      const gy = L.gate.baseY != null ? L.gate.baseY : L.ground;
      const gh = 86;
      const gw = 96;
      // 连廊伸进城门内侧，由城门盖住连接处
      const gateY = gy - gh * 0.72;
      const gateLeft = L.gate.cx - gw * 0.22;
      const gateRight = L.gate.cx + gw * 0.22;
      const side = (t, dir) => ({
        x: t.cx + dir * t.w * 0.28,
        y: t.baseY - t.h * 0.48,
      });
      const drawSeg = (x1, y1, x2, y2) => {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const count = Math.max(6, Math.floor(len / 22));
        // 城垛先画（在连廊主体后面）
        for (let i = 1; i < count; i++) {
          const u = i / count;
          const px = lerp(x1, x2, u);
          const py = lerp(y1, y2, u);
          ctx.fillStyle = i % 2 ? "#b89570" : "#a88860";
          roundRect(px - 5, py - 20, 10, 16, 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(90,70,45,0.25)";
          ctx.lineWidth = 1;
          roundRect(px - 5, py - 20, 10, 16, 2);
          ctx.stroke();
        }
        // 连廊主体盖住城垛下半
        ctx.strokeStyle = "#9a7a58";
        ctx.lineWidth = 20;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = "#c4a882";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(x1, y1 - 2);
        ctx.lineTo(x2, y2 - 2);
        ctx.stroke();
      };
      const smR = side(T.shengmu, 1);
      const jmL = side(T.jiemu, -1);
      const jmR = side(T.jiemu, 1);
      const ymL = side(T.yunmu, -1);
      const ymR = side(T.yunmu, 1);
      const ztL = side(T.zhengti, -1);
      drawSeg(smR.x, smR.y, jmL.x, jmL.y);
      drawSeg(jmR.x, jmR.y, gateLeft, gateY);
      drawSeg(gateRight, gateY, ymL.x, ymL.y);
      drawSeg(ymR.x, ymR.y, ztL.x, ztL.y);
    }

    function drawPlaza(cx, cy, rw, rh) {
      // 石板主面
      const pg = ctx.createRadialGradient(cx, cy - rh * 0.2, 10, cx, cy, rw);
      pg.addColorStop(0, "#e2d4b8");
      pg.addColorStop(0.55, "#c9b89a");
      pg.addColorStop(1, "#a89070");
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
      ctx.fill();

      // 外环
      ctx.strokeStyle = "#8a7355";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "#d8c8a8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rw - 6, rh - 4, 0, 0, Math.PI * 2);
      ctx.stroke();

      // 放射石缝
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rw - 4, rh - 3, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = "rgba(90,70,45,0.22)";
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * rw, cy + Math.sin(a) * rh);
        ctx.stroke();
      }
      // 同心圆
      for (let k = 1; k <= 3; k++) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, (rw * k) / 3.4, (rh * k) / 3.4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      // 中心花纹
      ctx.fillStyle = "rgba(232,106,60,0.2)";
      ctx.beginPath();
      ctx.ellipse(cx, cy, 18, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(232,106,60,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 22, 12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 杆子+底座：在城门之前绘制，被门楼与城垛遮挡
    function drawHornPole(cx, cy, baseY) {
      const plantY = baseY != null ? baseY : cy + 36;
      ctx.save();
      ctx.strokeStyle = "#6b4a2e";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, plantY);
      ctx.lineTo(cx, cy + 10);
      ctx.stroke();
      ctx.strokeStyle = "#8b5a2b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, plantY);
      ctx.lineTo(cx, cy + 10);
      ctx.stroke();
      // 杆底固定环（落在门楼后方）
      ctx.fillStyle = "#c4a882";
      ctx.beginPath();
      ctx.ellipse(cx, plantY + 2, 10, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6b4a2e";
      ctx.beginPath();
      ctx.ellipse(cx, plantY, 7, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 喇叭本体+声调条：在城门之后绘制，露在雉堞上方
    function drawHorn(cx, cy) {
      const pulse = hornSpeaking ? 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 140)) : hornPulse;
      const scale = 1 + pulse * 0.1;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      // 喇叭本体
      ctx.fillStyle = "#8b5a2b";
      roundRect(-7, -6, 14, 20, 4);
      ctx.fill();
      ctx.fillStyle = "#f0a01a";
      ctx.beginPath();
      ctx.moveTo(-6, -4);
      ctx.lineTo(44, -30);
      ctx.lineTo(44, 16);
      ctx.lineTo(-6, 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffe6a8";
      ctx.beginPath();
      ctx.ellipse(44, -6, 7, 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#c47a12";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(44, -6, 7, 24, 0, 0, Math.PI * 2);
      ctx.stroke();

      if (pulse > 0.05) {
        ctx.strokeStyle = `rgba(240,160,26,${0.55 * pulse})`;
        ctx.lineWidth = 3;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(54, -6, 10 + i * 11 * pulse, -0.85, 0.65);
          ctx.stroke();
        }
      }

      ctx.restore();

      // 四声汉字条：后画、位置更高，不被喇叭挡住
      if ((hornSpeaking || hornToneSlots.length) && (playMode === "duo" || playMode === "trio" || playMode === "zhengti")) {
        const slots = hornToneSlots;
        if (slots.length) {
          const n = slots.length;
          const boxW = Math.min(260, Math.max(120, W * 0.14 * n));
          const barCx = cx;
          const barY = cy - 118;
          ctx.save();
          ctx.fillStyle = "rgba(255,255,255,0.96)";
          roundRect(barCx - boxW / 2, barY, boxW, 66, 14);
          ctx.fill();
          ctx.strokeStyle = "rgba(240,160,26,0.5)";
          ctx.lineWidth = 2;
          roundRect(barCx - boxW / 2, barY, boxW, 66, 14);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.96)";
          ctx.beginPath();
          ctx.moveTo(barCx - 10, barY + 66);
          ctx.lineTo(barCx + 10, barY + 66);
          ctx.lineTo(barCx, barY + 76);
          ctx.closePath();
          ctx.fill();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          slots.forEach((slot, si) => {
            const i = slot.toneIndex;
            const x = barCx - boxW / 2 + (boxW * (si + 0.5)) / n;
            const active = i === hornToneIndex;
            ctx.fillStyle = active ? "#c47a12" : "rgba(42,58,74,0.45)";
            ctx.font = `700 ${Math.max(10, W * 0.014)}px "Noto Sans SC", sans-serif`;
            ctx.fillText(TONE_NAMES[i], x, barY + 14);
            ctx.font = `700 ${Math.max(13, W * 0.02)}px "ZCOOL KuaiLe", sans-serif`;
            ctx.fillStyle = active ? "#e86a3c" : "#2a3a4a";
            ctx.fillText(slot.form, x, barY + 34);
            ctx.font = `700 ${Math.max(12, W * 0.017)}px "Noto Sans SC", sans-serif`;
            ctx.fillStyle = active ? "#2a9d8f" : "rgba(42,58,74,0.55)";
            ctx.fillText(slot.hz, x, barY + 52);
          });
          ctx.restore();
        }
      }

      hornPulse = Math.max(0, hornPulse - 0.02);
    }

    function drawActor(a, t) {
      if (!a.visible) return;
      const syncPlay = a.phase === "play" && playmatesReady();
      const bob = syncPlay
        ? Math.sin(t * 4.2) * 5
        : Math.sin(t * 6 + a.x * 0.01) * (a.phase === "play" ? 5 : 2);
      const x = a.x;
      const y = a.y + bob;
      a._drawX = x;
      a._drawY = y;
      const bellyW = actorBellyW(a.text);
      const bellyH = 34;
      const bodyRx = bellyW * 0.58;
      const bodyRy = 28;
      const sc = a.scale == null ? 1 : a.scale;
      // 跳舞时影子钉在广场地面（用 ty），不随身体上下，表示在跳
      const groundY = a.phase === "play" && a.ty != null ? a.ty : y;
      const shadowY = groundY + bodyRy + 3;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(sc, sc);
      ctx.translate(-x, -y);
      const alpha = a.alpha == null ? 1 : a.alpha;
      if (alpha <= 0.02) {
        ctx.restore();
        return;
      }
      ctx.globalAlpha = alpha;

      // 影子先画（与城堡一样），跳舞时 y 固定在地面
      ctx.fillStyle = "rgba(42,58,74,0.18)";
      ctx.beginPath();
      ctx.ellipse(x, shadowY, bodyRx * 0.88, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.ellipse(x, y, bodyRx, bodyRy, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      roundRect(x - bellyW / 2, y - bellyH / 2, bellyW, bellyH, 14);
      ctx.fill();
      ctx.fillStyle = a.color;
      const chars = Math.max(1, String(a.text || "").length);
      const fontSize = Math.max(14, Math.min(22, (bellyW - 10) / Math.max(1, chars * 0.72)));
      ctx.font = `700 ${fontSize}px "ZCOOL KuaiLe", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(a.text, x, y + 1);

      ctx.fillStyle = "#2a3a4a";
      ctx.beginPath();
      ctx.arc(x - 12, y - 24, 2.4, 0, Math.PI * 2);
      ctx.arc(x + 12, y - 24, 2.4, 0, Math.PI * 2);
      ctx.fill();

      // 小手
      if (syncPlay) {
        // 双人/三人：靠边的手点（双人不画渐变连线，靠挨紧表示拉手）
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(x - bodyRx * 0.88, y + 2, 6, 0, Math.PI * 2);
        ctx.arc(x + bodyRx * 0.88, y + 2, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (a.phase === "play" && playMode === "zhengti") {
        // 整体认读：两只手沿身体上下摇动玩耍
        const hy = y + Math.sin(t * 5.5) * 12;
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(x - bodyRx * 0.95, hy, 5.5, 0, Math.PI * 2);
        ctx.arc(x + bodyRx * 0.95, hy, 5.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHandLinks(t) {
      // 仅三人牵手时画短连线；双人挨紧靠手点即可
      if (playMode !== "trio" || !playmatesReady()) return;
      const order = ["sm", "jm", "ym"];
      const list = order
        .map((r) => actors.find((a) => a.role === r && a.visible && a.phase === "play"))
        .filter(Boolean);
      if (list.length < order.length) return;

      for (let i = 0; i < list.length - 1; i++) {
        const a = list[i];
        const b = list[i + 1];
        const aw = actorBellyW(a.text) * 0.58;
        const bw = actorBellyW(b.text) * 0.58;
        const x1 = (a._drawX != null ? a._drawX : a.x) + aw * 0.88;
        const y1 = (a._drawY != null ? a._drawY : a.y) + 2;
        const x2 = (b._drawX != null ? b._drawX : b.x) - bw * 0.88;
        const y2 = (b._drawY != null ? b._drawY : b.y) + 2;
        // 已经挨得很近就不画线
        if (x2 - x1 < 10) continue;
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2 + Math.sin(t * 4.2 + i) * 3;

        ctx.strokeStyle = "rgba(42,58,74,0.22)";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(mx, my + 6, x2, y2);
        ctx.stroke();

        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
        grad.addColorStop(0, a.color);
        grad.addColorStop(1, b.color);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(mx, my + 6, x2, y2);
        ctx.stroke();
      }
    }

    function updateActors(progress, t) {
      const L = layout();
      actors.forEach((a) => {
        // 已回家：门口保持闭合，不再开合
        if (a.atHome) return;

        // 大门进出步行（出场 / 回家，速度与声母韵母首次出场一致）
        if (a.walkKind && a.walkStart != null) {
          const done = stepDoorWalk(a);
          if (done && a.playing && !a.goingHome) {
            a.phase = "play";
            a.drawBehindSm = false;
            a.alpha = 1;
          }
          return;
        }

        if (playMode === null) return;

        // 开始经大门回家
        const shouldReturn =
          a.goingHome ||
          progress >= 0.8 ||
          playMode === "none" ||
          (playMode === "zhengti" && (a.role === "sm" || a.role === "ym") && !a.playing);

        if (shouldReturn && !(a.playing && progress < 0.8 && !a.goingHome)) {
          startDoorEnter(a, L);
          stepDoorWalk(a);
          return;
        }

        // 已在广场：短距靠拢稍慢
        if (a.playing) {
          a.visible = true;
          a.scale = 1;
          a.alpha = 1;
          a.behindTower = false;
          a.walkT = (a.walkT || 0) + 0.04;
          a.x = lerp(a.x, a.tx, 0.06);
          a.y = lerp(a.y, a.ty, 0.06);

          const arrived = Math.hypot(a.x - a.tx, a.y - a.ty) < 8;
          if (arrived && progress < 0.8) {
            a.phase = "play";
            a.drawBehindSm = false;
          }
        }
      });

      // 全员到齐后再一起摇摆拉手（三人模式须等介母到广场）
      if (progress < 0.8) {
        if (playmatesReady()) {
          actors.forEach((a) => {
            if (a.phase !== "play" || !a.playing) return;
            const sway = Math.sin(t * 2.1) * 5;
            a.x = a.tx + sway;
            a.y = a.ty + Math.sin(t * 4.2) * 5;
          });
        } else if (playMode === "zhengti") {
          actors.forEach((a) => {
            if (a.phase !== "play" || !a.playing) return;
            a.y = a.ty + Math.sin(t * 5) * 4;
          });
        }
      }
    }

    function draw(now) {
      const t = (now - t0) / 1000;
      if (!dayPaused) {
        dayProgress = clamp((now - dayStart) / DAY_MS, 0, 1);
      } else {
        dayProgress = pauseAt;
      }

      if (today) setStory(today, dayProgress);

      // 声母韵母出门后弹出题目
      if (today && !quizSolved && !quizOpen && dayProgress >= 0.28 && dayProgress < 0.8) {
        openQuiz();
      }

      updateActors(dayProgress, t);

      const sky = skyColors(dayProgress);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, sky.top);
      g.addColorStop(0.45, sky.mid);
      g.addColorStop(0.62, sky.low);
      g.addColorStop(0.63, "#9fd46a");
      g.addColorStop(0.82, "#5dbb4a");
      g.addColorStop(1, "#3f9a38");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const night = clamp((dayProgress - 0.88) / 0.12, 0, 1);
      const sun = sunPos(dayProgress);
      if (sun.visible) drawSun(sun.x, sun.y);
      if (night > 0.2) drawMoon(W * 0.78, H * 0.16, night);

      drawCloud((t * 12 + dayIndex * 40) % (W + 120) - 60, H * 0.14, 1.05, 0.7 * (1 - night * 0.5));
      drawCloud((t * 7 + 260) % (W + 160) - 80, H * 0.22, 0.8, 0.5 * (1 - night * 0.5));

      ctx.fillStyle = "#6fbf55";
      ctx.beginPath();
      ctx.moveTo(0, H * 0.62);
      ctx.quadraticCurveTo(W * 0.25, H * 0.52, W * 0.5, H * 0.6);
      ctx.quadraticCurveTo(W * 0.75, H * 0.68, W, H * 0.55);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.fill();

      const L = layout();
      const T = L.towers;
      const waveSm = t * 2.4;
      const waveJm = t * 2.4 + 1.1;
      const waveYm = t * 2.4 + 2.2;
      const waveZt = t * 2.4 + 3.3;
      const lit = night > 0.35;

      // 连廊 → 喇叭杆 → 城门 → 门内精灵 → 塔楼/广场 → 广场与回家途中精灵（在城堡前）→ 喇叭
      drawWalls(L, T);
      drawHornPole(L.horn.cx, L.horn.cy, L.horn.baseY);
      drawGate(L);
      actors.filter((a) => a.behindTower).forEach((a) => drawActor(a, t));
      drawTower(T.jiemu.cx, T.jiemu.baseY, T.jiemu.w, T.jiemu.h, FAMILY.jiemu.color, FAMILY.jiemu.soft, "介母", waveJm, 48, lit, doorOpenAmount("jiemu"));
      drawTower(T.yunmu.cx, T.yunmu.baseY, T.yunmu.w, T.yunmu.h, FAMILY.yunmu.color, FAMILY.yunmu.soft, "韵母", waveYm, 48, lit, doorOpenAmount("yunmu"));
      drawPlaza(L.plaza.cx, L.plaza.cy, L.plaza.rw, L.plaza.rh);
      drawTower(T.shengmu.cx, T.shengmu.baseY, T.shengmu.w, T.shengmu.h, FAMILY.shengmu.color, FAMILY.shengmu.soft, "声母", waveSm, 48, lit, doorOpenAmount("shengmu"));
      drawTower(T.zhengti.cx, T.zhengti.baseY, T.zhengti.w, T.zhengti.h, FAMILY.zhengti.color, FAMILY.zhengti.soft, "整体认读", waveZt, 48, lit, doorOpenAmount("zhengti"));

      const frontActors = actors.filter((a) => !a.behindTower);
      // 介母从声母身后走过时，先画介母再画声母
      frontActors.sort((a, b) => Number(!!b.drawBehindSm) - Number(!!a.drawBehindSm));
      frontActors.forEach((a) => drawActor(a, t));
      drawHandLinks(t);
      drawHorn(L.horn.cx, L.horn.cy);

      if (night > 0) {
        ctx.fillStyle = `rgba(10,18,36,${0.45 * night})`;
        ctx.fillRect(0, 0, W, H);
      }

      if (dayProgress >= 1 && !advancing && !dayPaused) {
        advancing = true;
        setTimeout(() => {
          beginDay();
          advancing = false;
        }, 500);
      }

      requestAnimationFrame(draw);
    }

    nextBtn.addEventListener("click", () => {
      unlockAudio();
      if (advancing || quizOpen) return;
      // 播报卡住时，点「下一天」可跳过并继续
      if (hornSpeaking) stopHornSpeak();
      beginDay();
    });

    canvas.addEventListener("pointerdown", (e) => {
      unlockAudio();
      if (quizOpen) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const L = layout();
      const dx = mx - L.horn.cx;
      const dy = my - L.horn.cy;
      const nearPole = Math.abs(dx) < 18 && my >= L.horn.cy - 20 && my <= (L.horn.baseY || L.horn.cy) + 8;
      // 城门顶喇叭（含杆、上方声调条）
      if (dx * dx + dy * dy < 75 * 75 || nearPole || (Math.abs(dx) < 140 && dy > -140 && dy < 30)) {
        if (playMode === "duo" || playMode === "trio" || playMode === "zhengti") {
          // 用户点喇叭：在手势内重播，并清掉「被拦截」标记再试一次
          audioBlocked = false;
          scheduleHornTones(0);
        } else {
          hornPulse = 1;
        }
      }
    });

    // 任意首次触摸也解锁（微信/Safari 更稳）
    document.addEventListener("pointerdown", unlockAudio, { once: true, passive: true });
    document.addEventListener("touchstart", unlockAudio, { once: true, passive: true });

    // 预热中文语音列表
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", () => {
        window.speechSynthesis.getVoices();
      });
    }

    window.addEventListener("resize", resize);
    resize();
    dayIndex = 0;
    beginDay();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
