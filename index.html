<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>拼音城堡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2a3a4a;
      --shengmu: #e86a3c;
      --jiemu: #3b82f6;
      --yunmu: #2a9d8f;
      --zhengti: #e9a825;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #1a2836;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    .stage {
      position: relative;
      width: min(100vw, 960px);
      height: 100dvh;
      min-height: 560px;
      margin: 0 auto;
      overflow: hidden;
      background: #7ec8ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      inset: max(12px, env(safe-area-inset-top)) 12px auto 12px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }

    .day-badge {
      min-width: 88px;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    .day-badge span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: rgba(42, 58, 74, 0.65);
    }

    .day-badge strong {
      display: block;
      margin-top: 2px;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 400;
      line-height: 1.1;
    }

    .story {
      flex: 1;
      max-width: 420px;
      margin: 0 auto;
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      text-align: center;
    }

    .story .brand {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(18px, 4vw, 24px);
    }

    .story p {
      margin: 6px 0 0;
      font-size: clamp(13px, 3.2vw, 15px);
      font-weight: 700;
      line-height: 1.45;
      color: rgba(42, 58, 74, 0.82);
    }

    .story .tag {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .story .tag.shengmu { background: var(--shengmu); }
    .story .tag.jiemu { background: var(--jiemu); }
    .story .tag.yunmu { background: var(--yunmu); }
    .story .tag.zhengti { background: var(--zhengti); }

    .hint {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      font-weight: 700;
      color: rgba(42, 58, 74, 0.7);
      cursor: pointer;
      pointer-events: auto;
      border: none;
      font-family: inherit;
    }

    .hint:active {
      transform: translateX(-50%) scale(0.97);
    }

    .hint[hidden] {
      display: none;
    }

    /* 云朵问答 */
    .quiz {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(0.92);
      z-index: 8;
      width: min(92vw, 420px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .quiz.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .cloud {
      position: relative;
      padding: 22px 20px 18px;
      border-radius: 28px;
      background: #fff;
      border: 3px solid rgba(42, 58, 74, 0.08);
    }

    .cloud::after {
      content: "";
      position: absolute;
      left: 28%;
      bottom: -16px;
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 22px 8px 0 #fff, 40px 4px 0 #fff;
    }

    .cloud .pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(28px, 8vw, 40px);
    }

    .cloud .chip {
      min-width: 64px;
      padding: 8px 14px;
      border-radius: 16px;
      color: #fff;
      text-align: center;
    }

    .cloud .chip.sm { background: var(--shengmu); }
    .cloud .chip.ym { background: var(--yunmu); }

    .cloud .plus {
      font-size: 22px;
      color: rgba(42, 58, 74, 0.45);
    }

    .cloud .ask {
      margin: 0;
      text-align: center;
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 700;
      line-height: 1.45;
    }

    .cloud .feedback {
      min-height: 22px;
      margin: 10px 0 0;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #2a9d8f;
    }

    .cloud .feedback.bad { color: #d4553a; }
    .cloud .feedback.hint { color: #c47a12; }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .answers.medial-pick {
      grid-template-columns: repeat(3, 1fr);
    }

    .answers button {
      padding: 14px 10px;
      border: 3px solid rgba(42, 58, 74, 0.1);
      border-radius: 18px;
      background: #fff8e8;
      color: var(--ink);
      font-family: inherit;
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 700;
      cursor: pointer;
    }

    .answers.medial-pick button {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(22px, 6vw, 30px);
      font-weight: 400;
      background: #e8f7f4;
    }

    .answers button:active {
      transform: scale(0.97);
    }

    .answers button.correct-flash {
      background: #d4f5e4;
      border-color: #2dc66d;
    }

    .answers button.wrong-flash {
      background: #ffe0d8;
      border-color: #f04b4b;
    }

    .answers button:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .chip.jm {
      background: var(--jiemu);
    }

    .quiz-panel[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="hud">
      <div class="day-badge">
        <span>城堡的第</span>
        <strong id="dayNum">1</strong>
        <span>天</span>
      </div>
      <div class="story">
        <div class="brand">拼音城堡</div>
        <p id="storyText">太阳快要升起了……</p>
      </div>
      <div class="day-badge" style="min-width:72px">
        <span>答对了</span>
        <strong id="correctCount">0</strong>
        <span>次</span>
      </div>
    </div>

    <canvas id="scene"></canvas>

    <div class="quiz" id="quiz" aria-live="polite">
      <div class="cloud">
        <!-- 第一问：能不能一起玩 -->
        <div class="quiz-panel" id="panelCan">
          <div class="pair">
            <span class="chip sm" id="quizSm">b</span>
            <span class="plus">+</span>
            <span class="chip ym" id="quizYm">a</span>
          </div>
          <p class="ask">这个声母和韵母可以在一起玩吗？</p>
          <p class="feedback" id="quizFeedback"></p>
          <div class="answers" id="answersCan">
            <button type="button" data-answer="ok">可以</button>
            <button type="button" data-answer="no">不可以</button>
            <button type="button" data-answer="medial">需要介母</button>
            <button type="button" data-answer="zhengti">整体认读</button>
          </div>
        </div>
        <!-- 第二问：选哪个介母 -->
        <div class="quiz-panel" id="panelMedial" hidden>
          <div class="pair">
            <span class="chip sm" id="medSm">j</span>
            <span class="plus">+</span>
            <span class="chip jm">?</span>
            <span class="plus">+</span>
            <span class="chip ym" id="medYm">a</span>
          </div>
            <p class="ask" id="medAsk">请一个介母来牵手吧！选哪一个？</p>
          <p class="feedback" id="medFeedback"></p>
          <div class="answers medial-pick" id="answersMedial">
            <button type="button" data-medial="i">i</button>
            <button type="button" data-medial="u">u</button>
            <button type="button" data-medial="ü">ü</button>
          </div>
        </div>
      </div>
    </div>

    <button class="hint" id="nextBtn" type="button">点这里 · 让日子往前走一天</button>
  </div>

  <script>
    const SHENGMU = [
      "b","p","m","f","d","t","n","l","g","k","h","j","q","x",
      "zh","ch","sh","r","z","c","s","y","w",
    ];
    const YUNMU = [
      "a","o","e","i","u","ü","ai","ei","ui","ao","ou","iu","ie","üe","er",
      "an","en","in","un","ün","ang","eng","ing","ong","üan",
    ];
    const ZHENGTI = [
      "zhi","chi","shi","ri","zi","ci","si","yi","wu","yu",
      "ye","yue","yuan","yin","yun","ying",
    ];

    // 整体认读 = 看起来像声母+韵母，但不能拼读，要整体认
    // 注意：yu 对应 y+ü（ü 去点写成 u），不是 y+韵母 u
    const ZHENGTI_PAIRS = [
      ["zh", "i", "zhi"], ["ch", "i", "chi"], ["sh", "i", "shi"], ["r", "i", "ri"],
      ["z", "i", "zi"], ["c", "i", "ci"], ["s", "i", "si"],
      ["y", "i", "yi"], ["w", "u", "wu"], ["y", "ü", "yu"],
      ["y", "e", "ye"], ["y", "üe", "yue"], ["y", "üan", "yuan"],
      ["y", "in", "yin"], ["y", "ün", "yun"], ["y", "ing", "ying"],
    ];

    const ZHENGTI_KEY = new Map(ZHENGTI_PAIRS.map(([sm, ym, syl]) => [`${sm}+${ym}`, syl]));

    // 两拼：声母 + 韵母 能直接组成音节
    // 注意：üe / üan 是独立复韵母，不是「介母ü + e/an」
    const TWO = {
      b: ["a","ai","ao","an","ang","ei","en","eng","i","ie","in","ing","o","u"],
      p: ["a","ai","ao","an","ang","ei","en","eng","i","ie","in","ing","o","ou","u"],
      m: ["a","ai","ao","an","ang","e","ei","en","eng","i","ie","in","ing","iu","o","ou","u"],
      f: ["a","an","ang","ei","en","eng","o","ou","u"],
      d: ["a","ai","ao","an","ang","e","ei","en","eng","i","ie","ing","iu","ong","ou","u","ui","un"],
      t: ["a","ai","ao","an","ang","e","ei","en","eng","i","ie","ing","ong","ou","u","ui","un"],
      n: ["a","ai","ao","an","ang","e","ei","en","eng","i","ie","in","ing","iu","ong","ou","u","ü","üe","ün"],
      l: ["a","ai","ao","an","ang","e","ei","eng","i","ie","in","ing","iu","ong","ou","u","ü","üe","ün","un","üan"],
      g: ["a","ai","ao","an","ang","e","ei","en","eng","ong","ou","u","ui","un"],
      k: ["a","ai","ao","an","ang","e","ei","en","eng","ong","ou","u","ui","un"],
      h: ["a","ai","ao","an","ang","e","ei","en","eng","ong","ou","u","ui","un"],
      j: ["i","ia","ie","in","ing","iu","ü","üe","ün","üan"],
      q: ["i","ia","ie","in","ing","iu","ü","üe","ün","üan"],
      x: ["i","ia","ie","in","ing","iu","ü","üe","ün","üan"],
      zh: ["a","ai","ao","an","ang","e","ei","en","eng","i","ong","ou","u","ui","un"],
      ch: ["a","ai","ao","an","ang","e","en","eng","i","ong","ou","u","ui","un"],
      sh: ["a","ai","ao","an","ang","e","ei","en","eng","i","ou","u","ui","un"],
      r: ["an","ang","e","en","eng","i","ong","ou","u","ui","un"],
      z: ["a","ai","ao","an","ang","e","ei","en","eng","i","ong","ou","u","ui","un"],
      c: ["a","ai","ao","an","ang","e","en","eng","i","ong","ou","u","ui","un"],
      s: ["a","ai","ao","an","ang","e","en","eng","i","ong","ou","u","ui","un"],
      // y/w：整体认读（yi/wu/yu/ye…）不进两拼；尤其 y+u ≠ yu（yu 是 ü 去点，整体认读）
      y: ["a","ao","an","ang","ong","ou"],
      w: ["a","ai","an","ang","ei","en","eng","o"],
    };

    // 三拼：声母 + 介母(i/u/ü) + 韵母
    // 勿把已是独立复韵母的 üe / üan 拆成 ü+e / ü+an
    const THREE = {
      b: { i: ["a","ao","an","ang"] },
      p: { i: ["a","ao","an","ang"] },
      m: { i: ["a","ao","an","ang"] },
      d: { i: ["a","ao","an","ang"], u: ["o","an","ai"] },
      t: { i: ["a","ao","an","ang"], u: ["o","an","ai"] },
      n: { i: ["a","ao","an","ang"], u: ["o","an"] },
      l: { i: ["a","ao","an","ang"], u: ["o","an"] },
      g: { u: ["a","o","ai","an","ang"] },
      k: { u: ["a","o","ai","an","ang"] },
      h: { u: ["a","o","ai","an","ang"] },
      j: { i: ["a","ao","an","ang","ong"] },
      q: { i: ["a","ao","an","ang","ong"] },
      x: { i: ["a","ao","an","ang","ong"] },
      zh: { u: ["a","o","ai","an","ang"] },
      ch: { u: ["a","o","ai","an","ang"] },
      sh: { u: ["a","o","ai","an","ang"] },
      r: { u: ["o","an"] },
      z: { u: ["o","an"] },
      c: { u: ["o","an"] },
      s: { u: ["o","an"] },
    };

    const FAMILY = {
      shengmu: { id: "shengmu", name: "声母家族", color: "#e86a3c", soft: "#ffb089", label: "声母" },
      jiemu: { id: "jiemu", name: "介母家族", color: "#3b82f6", soft: "#93c5fd", label: "介母" },
      yunmu: { id: "yunmu", name: "韵母家族", color: "#2a9d8f", soft: "#7ed6cb", label: "韵母" },
      zhengti: { id: "zhengti", name: "整体认读家族", color: "#e9a825", soft: "#ffe08a", label: "整体认读" },
    };

    const ANSWER_LABEL = { ok: "可以", medial: "需要介母", no: "不可以", zhengti: "整体认读" };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const dayNumEl = document.getElementById("dayNum");
    const storyTextEl = document.getElementById("storyText");
    const correctCountEl = document.getElementById("correctCount");
    const nextBtn = document.getElementById("nextBtn");
    const quizEl = document.getElementById("quiz");
    const panelCan = document.getElementById("panelCan");

    const quizSmEl = document.getElementById("quizSm");
    const quizYmEl = document.getElementById("quizYm");

    const medSmEl = document.getElementById("medSm");
    const medYmEl = document.getElementById("medYm");
    const medFeedbackEl = document.getElementById("medFeedback");
    const answerBtns = [...document.querySelectorAll("#answersCan [data-answer]")];
    const medialBtns = [...document.querySelectorAll("#answersMedial [data-medial]")];

    let W = 0;
    let H = 0;
    let t0 = performance.now();

    const DAY_MS = 16000;
    let dayIndex = 1;
    let dayStart = performance.now();
    let dayProgress = 0;
    let dayPaused = false;
    let pauseAt = 0;
    let advancing = false;

    let today = null;
    let actors = [];
    let quizOpen = false;
    let quizStage = "can"; // can | medial
    let quizSolved = false;
    let correctCount = 0; // 累计答对次数
    /** null=未定, duo=两人玩, trio=三人玩, zhengti=整体认读自己玩, none=不能玩 */
    let playMode = null;
    let hornSpeaking = false;
    let hornToneIndex = -1; // 0..3 原声调下标；无字声调不会播
    let hornTonedForms = [];
    let hornHanziForms = [];
    let hornToneSlots = []; // 仅有汉字的声调槽
    let hornTimer = 0;
    let hornPulse = 0;
    let hornAudio = null;

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // —— 声调：给拼音标调，喇叭读四声 ——
    const TONE_VOWELS = {
      a: ["ā", "á", "ǎ", "à"],
      o: ["ō", "ó", "ǒ", "ò"],
      e: ["ē", "é", "ě", "è"],
      i: ["ī", "í", "ǐ", "ì"],
      u: ["ū", "ú", "ǔ", "ù"],
      ü: ["ǖ", "ǘ", "ǚ", "ǜ"],
      v: ["ǖ", "ǘ", "ǚ", "ǜ"],
    };

    function normalizeSyl(raw) {
      let s = String(raw || "").toLowerCase().replace(/v/g, "ü");
      // j/q/x + u 在拼写上是 u，读音是 ü；字表用 ju/qu/xu
      return s;
    }

    function toneHanziList(base) {
      const key = normalizeSyl(base);
      let arr = (TONE_CHARS[key] || ["", "", "", ""]).slice();
      if (!arr.some(Boolean) && /[ü]/.test(key)) {
        const alt = key.replace(/ü/g, "u");
        if (TONE_CHARS[alt]) arr = TONE_CHARS[alt].slice();
      }
      if (!arr.some(Boolean) && /^[jqx]u/.test(key)) {
        // already ju form
      }
      return arr;
    }

    /** 只保留有对应汉字的声调（无字的不显示、不播报） */
    function toneSlots(base) {
      const hanzi = toneHanziList(base);
      const slots = [];
      for (let i = 0; i < 4; i++) {
        if (!hanzi[i]) continue;
        slots.push({
          toneIndex: i,
          form: applyTone(base, i + 1),
          hz: hanzi[i],
        });
      }
      return slots;
    }


    function applyTone(raw, toneNum) {
      // toneNum 1-4；先规范化 ü
      let s = String(raw).replace(/v/g, "ü");
      const idx = toneNum - 1;
      const chars = [...s];
      let markAt = -1;
      const lower = s.toLowerCase();

      if (lower.includes("a")) markAt = lower.indexOf("a");
      else if (lower.includes("o")) markAt = lower.indexOf("o");
      else if (lower.includes("e")) markAt = lower.indexOf("e");
      else if (lower.includes("iu")) markAt = lower.indexOf("u"); // iu → 标在 u
      else if (lower.includes("ui")) markAt = lower.indexOf("i"); // ui → 标在 i
      else {
        for (let i = chars.length - 1; i >= 0; i--) {
          if ("aiouüv".includes(chars[i].toLowerCase()) || chars[i] === "ü") {
            markAt = i;
            break;
          }
        }
      }
      if (markAt < 0) return s + ["", "ˊ", "ˇ", "ˋ"][idx];

      const ch = chars[markAt];
      const key = ch === "ü" || ch === "Ü" ? "ü" : ch.toLowerCase();
      const marks = TONE_VOWELS[key];
      if (!marks) return s;
      chars[markAt] = ch === ch.toUpperCase() && ch !== "ü" ? marks[idx].toUpperCase() : marks[idx];
      return chars.join("");
    }

    let audioUnlocked = false;
    let audioBlocked = false; // 手机拦截自动播放后，本轮只做画面播报，不卡流程

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      audioBlocked = false;
      try {
        // 静音短音：在用户点击手势里解锁 Audio / iOS 策略
        const a = new Audio(
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
        );
        a.volume = 0.01;
        const p = a.play();
        if (p && p.then) p.then(() => a.pause()).catch(() => {});
      } catch (_) {}
      try {
        const synth = window.speechSynthesis;
        if (synth) {
          synth.getVoices();
          const u = new SpeechSynthesisUtterance("嗯");
          u.volume = 0.01;
          u.rate = 2;
          u.lang = "zh-CN";
          // 不要立刻 cancel，否则部分浏览器会锁死后续 speak
          synth.speak(u);
        }
      } catch (_) {}
    }

    function releaseHornPause() {
      if (!quizOpen && dayPaused) {
        dayPaused = false;
        dayStart = performance.now() - pauseAt * DAY_MS;
      }
    }

    function stopHornSpeak() {
      // 作废正在进行的四声播报（含异步 await）
      speakFourTones._gen = (speakFourTones._gen || 0) + 1;
      if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
      if (hornAudio) {
        try {
          hornAudio.onended = null;
          hornAudio.onerror = null;
          hornAudio.pause();
          hornAudio.removeAttribute("src");
          hornAudio.load();
        } catch (_) {}
        hornAudio = null;
      }
      if (hornTimer) {
        clearTimeout(hornTimer);
        hornTimer = 0;
      }
      const was = hornSpeaking;
      hornSpeaking = false;
      hornToneIndex = -1;
      hornPulse = 0;
      hornToneSlots = [];
      if (was) releaseHornPause();
    }

    function currentPlaySyllable() {
      if (!today || !today.quiz) return null;
      if (playMode === "duo" || playMode === "zhengti" || playMode === "trio") return today.quiz.syllable;
      return null;
    }

    function scheduleHornTones(delayMs) {
      stopHornSpeak();
      const syl = currentPlaySyllable();
      if (!syl) return;
      const slots = toneSlots(syl);
      hornToneSlots = slots;
      hornTonedForms = slots.map((s) => s.form);
      hornHanziForms = slots.map((s) => s.hz);
      if (!slots.length) return; // 四个声调都无常用字：不播、不展示
      const delay = delayMs == null ? 400 : delayMs;
      hornTimer = setTimeout(() => speakFourTones(syl), delay);
    }

    function waitMs(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    /** 在线中文发音；被拦截或失败时快速放弃，绝不挂死 */
    function playOnlineZh(text) {
      return new Promise((resolve, reject) => {
        if (audioBlocked) {
          reject(new Error("audio blocked"));
          return;

        const urls = [
          `https://tts.youdao.com/fanyivoice?word=${encodeURIComponent(text)}&le=zh&keyfrom=speaker-target`,
          `https://fanyi.sogou.com/reventondc/synthesis?text=${encodeURIComponent(text)}&speed=1&lang=zh-CHS&from=translateweb&speaker=1`,
          `https://tts.baidu.com/text2audio?lan=zh&ie=UTF-8&spd=3&text=${encodeURIComponent(text)}`,
        ];
        let idx = 0;

        function tryNext() {
          if (idx >= urls.length) {
            reject(new Error("online tts failed"));
            return;
          }
          const url = urls[idx++];
          const a = new Audio();
          a.preload = "auto";
          hornAudio = a;
          let settled = false;
          const failTimer = setTimeout(() => {
            if (settled) return;
            settled = true;
            try { a.pause(); } catch (_) {}
            tryNext();
          }, 2200);

          const done = (ok) => {
            if (settled) return;
            settled = true;
            clearTimeout(failTimer);
            if (ok) resolve(true);
            else tryNext();
          };

          a.onended = () => done(true);
          a.onerror = () => done(false);
          a.src = url;
          const p = a.play();
          if (p && p.catch) {
            p.catch((err) => {
              const msg = String((err && (err.name || err.message)) || err || "");
              if (/NotAllowed|not allowed|NotSupported/i.test(msg)) {
                audioBlocked = true;
                settled = true;
                clearTimeout(failTimer);
                reject(err || new Error("not allowed"));
                return;
              }
              done(false);
            });
          }
        }

        tryNext();
      });
    }

    function playSynthZh(text, opts) {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;
        // 系统语音不受 online Audio 拦截标记影响
        if (!synth) {
          resolve(false);
          return;
        }
        let settled = false;
        const finish = (ok) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(ok);
        };
        // 手机上 speechSynthesis 常不触发 onend，必须超时兜底
        const timer = setTimeout(() => {
          try { synth.cancel(); } catch (_) {}
          finish(true); // 超时也视为已播，避免整轮无声空转
        }, 1800);

        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-CN";
          u.rate = (opts && opts.rate) || 0.85;
          u.pitch = (opts && opts.pitch) || 1;
          const voices = synth.getVoices();
          const zh =
            voices.find((v) => /zh-CN/i.test(v.lang) && /neural|online|natural|Xiaoxiao|Yunyang|Yaoyao|Huihui|晓|云|慧/i.test(v.name)) ||
            voices.find((v) => /zh(-CN|_CN)?/i.test(v.lang)) ||
            null;
          if (zh) u.voice = zh;
          u.onend = () => finish(true);
          u.onerror = () => finish(false);
          try { synth.cancel(); } catch (_) {}
          synth.speak(u);
          // iOS 偶尔 pause 住，轻推一下
          setTimeout(() => {
            try {
              if (synth.paused) synth.resume();
            } catch (_) {}
          }, 40);
        } catch (_) {
          finish(false);
        }
      });
    }

        clearTimeout(hardStop);

      // 按实际要播的声调数估超时，防手机卡死
      const hardStop = setTimeout(() => {
        if (gen !== speakFourTones._gen || !hornSpeaking) return;
        if (hornTimer) {
          clearTimeout(hornTimer);
          hornTimer = 0;
        }
        try {
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        } catch (_) {}
        finish();
      }, Math.min(12000, 2500 * slots.length + 2000));

      async function speakNext() {
        if (gen !== speakFourTones._gen || !hornSpeaking || !today) {
          clearTimeout(hardStop);
          return finish();
        }
        if (step >= slots.length) {
          clearTimeout(hardStop);
          return finish();
        }

        const slot = slots[step];
        const i = slot.toneIndex;
        hornToneIndex = i;
        hornPulse = 1;
        if (today) setStory(today, dayProgress);

        const override = SPEAK_OVERRIDE[`${normalizeSyl(base)}|${i + 1}`];
        const spoken = override || slot.hz;

        const voicePromise = playToneVoice(spoken, { rate: 0.82 });
        await Promise.race([voicePromise, waitMs(audioBlocked ? 700 : 2800)]);
        if (gen !== speakFourTones._gen || !hornSpeaking) {

          return;

        step += 1;
        hornTimer = setTimeout(speakNext, audioBlocked ? 280 : 420);
      }

      if (window.speechSynthesis) window.speechSynthesis.getVoices();
      speakNext();
